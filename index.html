<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balloon Defense</title>
<link rel="icon" href="assets/ui/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

<!-- Loading -->
<div id="loading" class="screen on">
  <img src="assets/ui/logo.svg" width="72" height="72" alt="">
  <div class="title" style="font-size:34px">Balloon Defense</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="muted" id="loadtxt">Loading art…</div>
</div>

<!-- Home page -->
<div id="menu" class="screen">
  <div class="menuhead">
    <img src="assets/ui/logo.svg" alt="">
    <div class="title">Balloon Defense</div>
    <button class="profchip" id="profChip" title="Your profile"></button>
    <div class="grow"></div>
    <div class="actions">
      <button class="btn wood" id="mUpgrades"><img class="icon" src="assets/ui/bolt.svg" alt="">Upgrades</button>
      <button class="iconbtn newsbtn" id="mNews" title="News: what's new in each version"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h13v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2Z" fill="#fff8e1" stroke="#5d4037" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 9h3v9a2 2 0 0 1-4 0" fill="#ffe0b2" stroke="#5d4037" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 8h7M7 11h7M7 14h4" stroke="#5d4037" stroke-width="1.6" stroke-linecap="round"/></svg><span class="sr">News</span></button>
      <button class="iconbtn bellbtn" id="mBell" title="Notifications"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4.2L4.3 16a.8.8 0 0 0 .7 1.2h14a.8.8 0 0 0 .7-1.2L18 13.2V9a6 6 0 0 0-6-6Z" fill="#ffd93d" stroke="#7a5600" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.6 19a2.5 2.5 0 0 0 4.8 0" fill="none" stroke="#7a5600" stroke-width="1.6" stroke-linecap="round"/></svg><i class="count" id="bellCount"></i><span class="sr">Notifications</span></button>
      <button class="iconbtn" id="mStats" title="Your stats"><img src="assets/ui/chart.svg" alt="Stats"></button>
      <button class="iconbtn chatbtn" id="mChat" title="Chat"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5Z" fill="#4fc3f7" stroke="#0d4f73" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8.5" cy="9.5" r="1.3" fill="#0d4f73"/><circle cx="12" cy="9.5" r="1.3" fill="#0d4f73"/><circle cx="15.5" cy="9.5" r="1.3" fill="#0d4f73"/></svg><span class="sr">Chat</span></button>
      <button class="iconbtn" id="mHelp" title="Info: how to play and the World Boss"><img src="assets/ui/help.svg" alt="Info"></button>
      <button class="iconbtn" id="mSettings" title="Settings"><img src="assets/ui/gear.svg" alt="Settings"></button>
    </div>
  </div>
  <div class="protectbar" id="protectBar"></div>
  <div class="continue" id="continueBox">
    <img src="assets/ui/play.svg" class="icon" alt="">
    <div class="grow"><b id="contTitle">Continue</b><div class="muted" id="contSub" style="font-size:13px"></div></div>
    <button class="btn" id="contDiscard">Discard</button>
    <button class="btn primary" id="contGo">Continue</button>
  </div>
  <div class="daily" id="daily"></div>
  <section class="boards playerbox">
    <div class="boardshead"><h2><img src="assets/ui/chart.svg" alt="">Players</h2><span class="muted" id="playersNote"></span><span id="shareBox"></span></div>
    <div class="playergrid" id="players"></div>
  </section>
  <section class="boards">
    <div class="boardshead"><h2><img src="assets/ui/trophy.svg" alt="">Leaderboards</h2></div>
    <div class="topboards" id="topBoards"></div>
    <div class="boardshead sub"><h3>Tier boards</h3>
      <span class="muted" id="boardNote"></span></div>
    <div class="boardgrid" id="boards"></div>
    <div class="wbsection" id="wbBox"></div>
  </section>
  <div class="tiers" id="tiers"></div>
  <div class="maps" id="maps"></div>
  <div class="menufoot" id="menufoot"></div>
  <div id="actToast"></div>
</div>

<!-- Upgrade tree -->
<div id="tree" class="screen"></div>

<!-- Game -->
<div id="game" class="screen">
  <div id="stage">
    <!-- The HUD lives in a bar above and a bar below the map, so nothing covers the map or the towers. -->
    <div class="hudbar top" id="hudTop">
      <div class="hgroup">
        <div class="hstat" id="sLivesBox" title="Lives"><img src="assets/ui/heart.svg" alt=""><span id="sLives">0</span></div>
        <div class="hstat" title="Cash"><img src="assets/ui/coin.svg" alt=""><span id="sCash">0</span></div>
      </div>
      <div class="hcenter">
        <div class="next" id="nextBox"><span id="nextLabel">Next:</span><div class="chips" id="nextChips"></div></div>
        <div id="bossbar"><b><svg class="skull" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7 2 4 5.6 4 10c0 2.6 1.2 4.4 3 5.5V19a1 1 0 0 0 1 1h1.5v-2h1.5v2h2v-2h1.5v2H16a1 1 0 0 0 1-1v-3.5c1.8-1.1 3-2.9 3-5.5 0-4.4-3-8-8-8Z" fill="#ede7f6"/><circle cx="9" cy="10.5" r="2.2" fill="#2a0f33"/><circle cx="15" cy="10.5" r="2.2" fill="#2a0f33"/><path d="M12 13l-1.3 2h2.6Z" fill="#2a0f33"/></svg><span id="bossName">COLOSSUS</span></b>
          <div class="bar"><i id="bossHp"></i><div id="bossMarks"></div></div><span id="bossTxt"></span></div>
      </div>
      <div class="hgroup right">
        <div class="hround"><span id="sRoundLbl">ROUND</span><b id="sRound">0</b><i id="sRoundOf">/60</i></div>
        <div class="hclock" id="sClockBox" title="Game clock: stops while paused or between rounds, runs 2x or 3x as fast on fast forward"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#fff8e1" stroke="#1b1206" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="#1b1206" stroke-width="2.2" stroke-linecap="round"/></svg><span id="sClock">0:00</span></div>
        <button class="roundgear" id="gPause" title="Pause (P / Esc)"><img src="assets/ui/pause.svg" alt="Pause"></button>
        <button class="roundgear" id="gSettings" title="Settings"><img src="assets/ui/gear.svg" alt="Settings"></button>
      </div>
    </div>
    <div id="boardWrap">
      <div id="board">
        <canvas id="cv"></canvas>
        <div id="vignette"></div>
        <div id="panel"></div>
      </div>
    </div>
    <div class="hudbar bottom" id="hudBot">
      <div id="abilWrap">
        <button id="abilToggle" title="Show or hide the ability tray"><span></span></button>
        <div id="abilities"></div>
      </div>
      <div class="hcenter"><div id="toasts"></div><div class="hmap" id="hMap"></div></div>
      <div id="roundWrap">
        <button id="abilBtn" title="Abilities"><img src="assets/ui/bolt.svg" alt="Abilities"></button>
        <button id="roundBtn" title="Start round (Space). During a round: tap for 1x/3x, hold for 2x"><img id="roundIcon" src="assets/ui/play.svg" alt=""><span id="roundTxt">PLAY</span></button>
      </div>
    </div>
  </div>
  <aside id="side">
    <button class="woodbtn" id="gUpgrades"><img src="assets/ui/bolt.svg" alt="">Upgrades</button>
    <div class="woodlabel" id="hoverName">Towers</div>
    <div id="shop"></div>
    <div id="info"></div>
    <div class="sidefoot">
      <button class="iconbtn" id="gSound" title="Sound on/off (M)"><img src="assets/ui/sound-off.svg" alt="Sound"></button>
      <button class="iconbtn" id="gHelp" title="Info (H)"><img src="assets/ui/help.svg" alt="Info"></button>
    </div>
  </aside>
</div>

<div id="dmgFlash" aria-hidden="true"></div>
<div id="notes" aria-live="polite"></div>
<div id="chatToasts" aria-live="polite"></div>
<div id="tipCard" role="tooltip"></div>
<div id="modal"><div class="card" id="modalCard"></div></div>
<input type="file" id="fileIn" accept=".txt,text/plain" hidden>

<script src="js/data.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/profile.js"></script>
<script src="js/share.js"></script>
<script src="js/worldboss.js"></script>
<script src="js/chat.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
